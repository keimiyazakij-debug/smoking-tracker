<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SmokingTracker</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4CAF50">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SmokingTracker">
  <style>
  </style>
  <script>
  const ENV = (location.hostname === "localhost" ||
               location.hostname === "127.0.0.1" ||
               location.hostname === "::1")
    ? "dev"
    : "prod";
  if ("serviceWorker" in navigator) {
    const sw = ENV === "prod"
      ? "./service-worker.prod.js"
      : "./service-worker.dev.js";

    navigator.serviceWorker.register(sw)
      .then(() => console.log("SW registered:", sw))
      .catch(err => console.error("SW error", err));
  }
  const BUILD = "2026-02-13-0.0.3";
  console.log("BUILD:", BUILD);
  window.APP_BUILD = BUILD;
  </script>
</head>
<body>
  <header>
    <div class="title-bar">
      <h1>SmokingTracker <span id="appVersion" class="title-version"></span></h1>
    </div>
  </header>

  <!-- メイン画面 -->
  <div id="main" class="tab active">
    <div class="main-layout">
      <!-- weekly summary card -->
      <!-- メイン統計は背景カードを解除（Design System v1.0） -->
      <section class="weekly-summary">
        <div class="weekly-summary-row">
          <div id="avg7Display" class="weekly-item"></div>
          <div id="thisWeekDisplay" class="weekly-item"></div>
          <div id="lastWeekDisplay" class="weekly-item"></div>
        </div>
      </section>
      <section class="today-status card">
        <div class="today-status-header">
          <div class="today-label">今日の状態</div>
          <div id="todayDisplay" class="today-date"></div>
        </div>
        <div id="since" class="since-text">禁煙時間：0分</div>
        <div class="today-count-row">
          <!-- text-hero / text-caption に分離（Design System v1.0） -->
          <div class="today-count-wrap">
            <!-- 数字と単位を横並び -->
            <div class="today-count-main">
              <div id="todayCountDisplay" class="today-count">0</div>
              <div id="todayCountUnit" class="today-count-unit">本</div>
            </div>
            <div id="todayTargetDisplay" class="today-target-display">目標 10本</div>
          </div>
          <div id="yesterdayDiff" class="yesterday-diff"></div>
        </div>
        <div id="progress-bar" class="progress-bar">
          <div id="progress"></div>
        </div>
      </section>

      <section class="smoke-action card">
        <button class="large-btn" id="smokeBtn">吸った</button>
        <div id="smokeHelp" class="smoke-help"></div>
        <div class="undo-row">
          <div id="undoSmokeWrap" class="undo-center">
            <button id="undoSmokeBtn" class="text-link">直前の記録を戻す</button>
          </div>
        </div>
      </section>

      <section class="history-section">
        <div class="history-actions">
          <button id="todayTimelineLink" class="text-link">
            今日の履歴
          </button>
          <button id="dailyChallengeLink" class="text-link">
            今日のチャレンジ
          </button>
        </div>
      </section>
    </div>
  </div>

  <!-- カレンダー画面 -->
  <div id="calendar" class="tab">
    <div class="calendar-header">
      <button onclick="calendarController.prevMonth()">◀</button>
      <span id="calendarTitle"></span>
      <button onclick="calendarController.nextMonth()">▶</button>
    </div>
    <!-- card: calendar -->
    <div class="card calendar-card">
      <div id="calendarGrid" class="calendar-grid"></div>
    </div>
  </div>

<!-- タイムライン（タブ画面） -->
<div id="timeline" class="tab">
  <header class="timeline-header">
    <div class="timeline-header-date">
      <button id="prevTimelineDay" class="timeline-nav">◀</button>
      <div id="timelineTitle" class="timeline-title-main"></div>
      <button id="nextTimelineDay" class="timeline-nav">▶</button>
      <button class="edit-btn" id="openEditBtn">編集</button>
    </div>
    <div id="timelineSummary" class="timeline-title-sub"></div>
  </header>
  <!-- card: timeline -->
  <div class="card timeline-card">
    <!-- Design System v1.0: ページタイトル -->
    <h2 class="timeline-page-title">時間帯別本数</h2>
    <!-- ヒートグリッド表示 -->
    <div id="timelineList" class="timeline-grid"></div>
    <!-- Design System v1.0: 凡例 -->
    <div class="timeline-legend" aria-hidden="true">
      <span class="legend-label">少</span>
      <span class="legend-chip legend-0"></span>
      <span class="legend-chip legend-1"></span>
      <span class="legend-chip legend-2"></span>
      <span class="legend-chip legend-3"></span>
      <span class="legend-label">多</span>
    </div>
  </div>
</div>

<!-- タイムライン詳細モーダル -->
<div id="timelineDetailModal" class="modal-overlay hidden">
  <div class="modal-card">
    <div class="modal-header">
      <div id="timelineDetailTitle" class="modal-title"></div>
      <button id="closeTimelineDetailBtn" class="modal-close">閉じる</button>
    </div>
    <div id="timelineDetailList" class="modal-body"></div>
  </div>
</div>

<!-- 修正画面（オーバーレイ） -->
<div id="editOverlay" class="timeline-overlay hidden">
  <header class="timeline-header">
    <button id="closeEditBtn">← 戻る</button>
    <span id="editTitle"></span>
  </header>

  <!-- card: edit -->
  <div class="card edit-body">
    <label class="edit-field">
      <span class="edit-field-label">日付</span>
      <input type="date" id="editDateInput">
      <p id="editDateLockNotice" class="edit-field-help"></p>
    </label>

    <label class="edit-field">
      <span class="edit-field-label">時刻</span>
      <div id="timeTags" class="time-tags"></div>
      <button type="button" id="addTimeTagBtn">＋ 追加</button>
    </label>

    <!-- 主ボタン: 保存 -->
    <button type="button" id="saveEditBtn" class="edit-save-btn">保存</button>
  </div>
</div>

<!-- プレミアム説明画面（詳細画面） -->
<div id="premiumOverlay" class="timeline-overlay hidden premium-overlay">
  <header class="timeline-header premium-header">
    <button id="closePremiumBtn" class="text-link">← 戻る</button>
  </header>
  <div class="card premium-card">
    <h2 class="premium-title">プレミアム版</h2>
    <p class="premium-subcopy">すべての記録を、<br>制限なく振り返る。</p>
    <ul class="premium-feature-list">
      <li>✓ 60日より前のデータ閲覧</li>
      <li>✓ 統計の期間制限なし</li>
      <li>✓ 広告なし（将来）</li>
    </ul>
    <div class="premium-price">買い切り 800円</div>
    <button id="premiumUpgradeBtn" class="large-btn premium-upgrade-btn">アップグレード</button>
    <button id="premiumLaterBtn" class="text-link premium-later-btn">あとで検討する</button>
  </div>
</div>

  <!-- 成果画面 
  <div id="achievements" class="tab">
    <h2>成果</h2>
    <div id="streakDisplay">連続禁煙：0日</div>
    <ul id="badges"></ul>
  </div>
  -->

  <!-- バッジ画面 -->
  <div id="badgeTab" class="tab">
    <h2>バッジ一覧</h2>
    <div id="allBadges"></div>
  </div>

  <!-- 履歴画面 -->
  <div id="history" class="tab">
    <h2>履歴（週表示）</h2>
    <div id="historyGraph"></div>
  </div>

<!-- 設定画面 -->
<div id="settings" class="tab">
  <!-- Design System v1.0: ページタイトル -->
  <h2 class="settings-page-title">設定</h2>

  <!-- プレミアム導線カード -->
  <section id="settingsPremiumCard" class="settings-card settings-premium-card">
    <h3 class="settings-section-title">プレミアム版</h3>
    <p class="settings-item-help">期間制限なし・広告なし</p>
  </section>

  <!-- セクション1: 目標設定 -->
  <section class="settings-card">
    <h3 class="settings-section-title">目標設定</h3>
    <label class="settings-item settings-item-input">
      <span class="settings-item-label">1日の目標本数</span>
      <span class="settings-input-wrap">
        <input type="number" id="dailyTarget" class="setting-input" min="0">
        <span class="settings-input-unit">本</span>
      </span>
    </label>
    <p class="settings-item-help">※変更した場合、新しい目標で評価されます</p>
  </section>

  <!-- セクション2: データ管理 -->
  <section class="settings-card">
    <h3 class="settings-section-title">データ管理</h3>
    <div class="settings-item settings-item-plan">
      <span class="settings-item-label">利用プラン</span>
      <div id="planInfo" class="settings-plan-info"></div>
    </div>
    <button onclick="resetAll()" class="settings-danger-btn">
      全データをリセット
    </button>
    <p class="settings-note">
      このアプリは端末内にデータを保存します。<br>
      ブラウザのデータを削除すると記録も消えます。
    </p>
  </section>
</div>

<!-- 統計情報画面 -->
<div id="stats" class="tab" style="display:none;">
  <!-- stats summary card: 画面最上部へ移動 -->
  <div class="card stats-summary-card">
    <div class="stats-summary-row">
      <div id="stats-current-total" class="stats-summary-item"></div>
      <div id="stats-current-avg" class="stats-summary-item"></div>
    </div>
    <div class="stats-summary-row">
      <div id="stats-prev-total" class="stats-summary-item"></div>
      <div id="stats-prev-avg" class="stats-summary-item"></div>
    </div>
  </div>
  <!-- 無料版60日ロック案内 -->
  <div id="statsFreeNotice" class="stats-free-notice"></div>

<!-- 集計期間 -->
<div class="stats-section stats-row">
  <span class="stats-label">集計期間:</span>
  <div class="stats-range-buttons">
    <button id="range-week">週</button>
    <button id="range-month">月</button>
  </div>
</div>

<!-- 集計内容 -->
<div class="stats-section stats-row">
  <span class="stats-label">集計内容:</span>
  <div class="stats-graph-buttons">
    <button id="graph-daily">日別本数</button>
    <button id="graph-hourly">時間帯別平均本数</button>
  </div>
</div>
  <!-- Design System v1.0: 合計値の主表示 -->
  <div id="stats-total-highlight" class="stats-total-highlight"></div>
  <!-- グラフ直上: タイトル/期間を2行表示 -->
  <div id="stats-header">
    <button id="stats-prev">◀</button>
    <div class="stats-header-text">
      <div id="stats-title"></div>
      <span id="stats-label"></span>
    </div>
    <button id="stats-next">▶</button>
  </div>
  <div id="stats-chart-wrap">
    <canvas id="stats-chart"></canvas>
  </div>
</div>

<!-- 下部タブ -->
<nav>
  <!-- Design System v1.0: tab selection state -->
  <button data-tab="main" aria-selected="true" onclick="showTab('main')">⌂</button>
  <button data-tab="calendar" aria-selected="false" onclick="showTab('calendar')">📅</button>
  <button data-tab="timeline" aria-selected="false" onclick="showTab('timeline')">🕒</button>
  <!--<button onclick="showTab('achievements')">★</button>-->
  <button data-tab="badgeTab" aria-selected="false" onclick="showTab('badgeTab')">🏅</button>
  <button data-tab="stats" aria-selected="false" onclick="showTab('stats')">📊</button>
  <button data-tab="settings" aria-selected="false" onclick="showTab('settings')">⚙</button>
</nav>

<!-- ===== 定数・共通 ===== -->
<script src="./common/constant.js"></script>
<script src="./common/common.js"></script>

<!-- ===== Model ===== -->
<script src="./model/logModel.js"></script>
<script src="./model/settingModel.js"></script>
<script src="./model/editModel.js"></script>
<script src="./model/dailyTaskModel.js"></script>
<script src="./model/badgeModel.js"></script>
<script src="./model/calendarModel.js"></script>
<script src="./model/statsModel.js"></script>

<!-- ===== Controller ===== -->
<script src="./controller/messageController.js"></script>
<script src="./controller/mainController.js"></script>
<script src="./controller/calendarController.js"></script>
<script src="./controller/timelineController.js"></script>
<script src="./controller/editController.js"></script>
<script src="./controller/dailyTaskController.js"></script>
<script src="./controller/badgeController.js"></script>
<script src="./controller/settingController.js"></script>
<script src="./controller/statsController.js"></script>
<script src="./controller/premiumController.js"></script>
<script src="./controller/appController.js"></script>

<!-- ===== View ===== -->
<script src="./view/mainView.js"></script>
<script src="./view/calendarView.js"></script>
<script src="./view/timelineView.js"></script>
<script src="./view/editView.js"></script>
<script src="./view/dailyTaskView.js"></script>
<script src="./view/badgeView.js"></script>
<script src="./view/settingView.js"></script>
<script src="./view/messageView.js"></script>
<script src="./view/statsView.js"></script>
<script src="./view/premiumView.js"></script>

<!-- ===== chart.js ===== -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


<!-- ===== 初期化 ===== -->
<script>
  const versionEl = document.getElementById("appVersion");
  if (versionEl && window.APP_BUILD) {
    versionEl.textContent = `v${window.APP_BUILD}`;
  }
</script>
</body>
</html>
