name: test

on:
  push:
  pull_request:

jobs:
  jest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: smoking-tracker-test
        run: npm install

      - name: Run tests
        working-directory: smoking-tracker-test
        run: npm test
